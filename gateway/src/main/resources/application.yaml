server:
  port: 8000
spring:
  application:
    name: short-link-gateway
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # 不设默认值：未配置时启动直接失败
      password: ${REDIS_PASSWORD}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    gateway:
      routes:
        - id: short-link-admin
          uri: lb://short-link-admin/api/short-link/admin/**
          predicates:
            - Path=/api/short-link/admin/**
          filters:
            - name: TokenValidate
              args:
                whitePathList:
                  - /api/short-link/admin/v1/user/login
                  - /api/short-link/admin/v1/user/has-username

        # 注意：短链接中台（project）的 /api/short-link/** 属于内部接口，
        # 只允许 admin 通过 Feign 直接调用，不能通过网关暴露给终端用户，
        # 否则任何登录用户都能绕过 admin 的归属校验直接操作他人的短链接。

short-link:
  login:
    # 必须与 admin 的 token-ttl-minutes 一致，校验通过后滑动续期
    token-ttl-minutes: ${LOGIN_TOKEN_TTL_MINUTES:30}
