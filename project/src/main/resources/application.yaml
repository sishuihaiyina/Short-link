server:
  port: 8001

spring:
  application:
    name: short-link-project
  datasource:
    # ShardingSphere 对 Driver 自定义，实现分库分表等隐藏逻辑
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    # ShardingSphere 配置文件路径
    url: jdbc:shardingsphere:classpath:shardingsphere-config-${database.env:dev}.yaml
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
  mvc:
    view:
      prefix: /templates/
      suffix: .html
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

# RocketMQ：统计消息的投递与消费
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: short-link-stats-producer-group
    send-message-timeout: 3000

short-link:
  domain:
    default: 127.0.0.1:8001
  mq:
    stats:
      # 统计消息 topic；正常投递和延迟重投共用同一个 topic
      topic: short-link-stats-topic
      # 消费组：重试次数耗尽后，消息进入 %DLQ%short-link-stats-consumer-group
      consumer-group: short-link-stats-consumer-group
      # 延迟等级：1=1s 2=5s 3=10s 4=30s 5=1m，对应原来 Redisson 延迟队列的 5 秒
      delay-level: 2
  stats:
    locale:
      amap-key: 58a604e754fddfa950323d69c7773c10

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
