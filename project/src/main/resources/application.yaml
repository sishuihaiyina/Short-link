server:
  port: 8001

spring:
  application:
    name: short-link-project
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # 不设默认值：未配置时启动直接失败，避免悄悄用开发密码跑起来
      password: ${REDIS_PASSWORD}
  mvc:
    view:
      prefix: /templates/
      suffix: .html
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

# RocketMQ：统计消息的投递与消费
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: short-link-stats-producer-group
    send-message-timeout: 3000

short-link:
  datasource:
    # ShardingSphere YAML 位置（由 ShardingSphereDataSourceConfiguration 解析占位符后建数据源）
    config-location: ${SHARDINGSPHERE_CONFIG:classpath:shardingsphere-config-${database.env:dev}.yaml}
  domain:
    # 对外暴露的短链域名，必须指向本服务的公网地址
    default: ${SHORT_LINK_DOMAIN:127.0.0.1:8001}
  internal:
    # 内部接口凭证：/api/** 只允许 admin 通过 Feign 调用，必须与 admin 端一致
    token: ${INTERNAL_API_TOKEN}
  mq:
    stats:
      # 统计消息 topic；正常投递和延迟重投共用同一个 topic
      topic: short-link-stats-topic
      # 消费组：重试次数耗尽后，消息进入 %DLQ%short-link-stats-consumer-group
      consumer-group: short-link-stats-consumer-group
      # 延迟等级：1=1s 2=5s 3=10s 4=30s 5=1m，对应原来 Redisson 延迟队列的 5 秒
      delay-level: 2
  stats:
    locale:
      amap-key: ${AMAP_KEY}
  recycle-bin:
    # 回收站保留天数，到期后物理删除链接及其统计数据
    retention-days: ${RECYCLE_BIN_RETENTION_DAYS:30}
    # 单次最多清理多少条
    batch-size: 200
    cleanup:
      enabled: ${RECYCLE_BIN_CLEANUP_ENABLED:true}
      # 每天凌晨 3 点执行
      cron: '${RECYCLE_BIN_CLEANUP_CRON:0 0 3 * * ?}'

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
